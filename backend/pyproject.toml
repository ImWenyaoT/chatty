[project]
name = "chatty-backend"
version = "0.1.0"
description = "Chatty recommendation agent backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "openai>=2.53.0",
  "openai-agents>=0.19.3",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.1",
  "ty>=0.0.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP047"]
